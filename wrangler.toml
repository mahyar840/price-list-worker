name = "price-list-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# هیچ KV لازم نیست -- همه‌چی از همین متغیرها میاد.
[vars]
DEFAULT_MARGIN = "20"
FONT_URL_REGULAR = "https://raw.githubusercontent.com/rastikerdar/vazirmatn/main/fonts/ttf/Vazirmatn-Regular.ttf"
FONT_URL_BOLD = "https://raw.githubusercontent.com/rastikerdar/vazirmatn/main/fonts/ttf/Vazirmatn-Bold.ttf"

# لینک raw همون عکس قالب که تو گیت‌هابت آپلود کردی
TEMPLATE_URL = "https://raw.githubusercontent.com/mahyar840/price-list-worker/refs/heads/main/assets/template-empty.png"

# TELEGRAM_BOT_TOKEN و ANTHROPIC_API_KEY رو به‌صورت Secret از داشبورد اضافه
# می‌کنی (نه اینجا) -- مرحله‌ی بعدی راهنماییت می‌کنم.

# دسترسی رایگان به مدل‌های Workers AI (برای تست OCR رایگان)
[ai]
binding = "AI"
